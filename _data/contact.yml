#  The contact options shown at the bottom of the sidebar.
#  `github` and `twitter` read their handle from `_config.yml`; everything else
#  needs an explicit `url`.

- type: email
  icon: "fas fa-envelope"
  noblank: true # open link in current tab

- type: scholar
  icon: "fas fa-graduation-cap"
  url: "https://scholar.google.com/citations?user=83Q2zz4AAAAJ"

- type: github
  icon: "fab fa-github"

- type: linkedin
  icon: "fab fa-linkedin"
  url: "https://www.linkedin.com/in/ruisun12/"

